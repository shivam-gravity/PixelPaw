<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<title>PixelPaw</title>
<style>
  :root {
    --bg: #f6f6f9; --panel: #fff; --line: #e4e4ec; --text: #17171f; --muted: #6b6b7b; --soft: #f0eefb;
    --accent: #7c3aed; --ok: #059669; --bad: #dc2626; --warn: #b45309; --live: #e11d48;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic",
            "Noto Sans JP", "Noto Sans KR", "Noto Sans SC", "Noto Sans Thai", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14141c; --panel: #1e1e29; --line: #2e2e3d; --text: #ececf3; --muted: #9a9aad; --soft: #262338;
            --accent: #a78bfa; --ok: #34d399; --bad: #f87171; --warn: #fbbf24; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font);
         padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
                  max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
  .badge.live { background: var(--live); color: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
  nav { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 2px; scrollbar-width: none; }
  nav a { flex: none; text-decoration: none; color: var(--muted); font-weight: 600; padding: 8px 12px; border-radius: 10px; }
  nav a.on { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  nav a .n { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; font-size: 11px; margin-inline-start: 4px; }
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } .wide { grid-column: 1 / -1; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 6px 0; } .muted { color: var(--muted); } small { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; margin: 4px 12px 4px 0; }
  input[type=text], input[type=password], input[type=number], input[type=time], select, textarea {
    width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 14px; min-height: 42px;
           cursor: pointer; background: var(--line); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  button:disabled { opacity: .55; cursor: progress; }
  .msg { font-size: 13px; overflow-wrap: anywhere; } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .note { font-size: 12px; color: var(--warn); margin-top: 4px; overflow-wrap: anywhere; }
  .draft { border-top: 1px solid var(--line); padding: 12px 0; } .draft:first-child { border-top: 0; padding-top: 0; }
  .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  ul.feed { list-style: none; margin: 0; padding: 0; max-height: 55vh; overflow: auto; }
  ul.feed li { padding: 7px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; } ul.feed li:first-child { border-top: 0; }
  pre.out { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
            padding: 10px; max-height: 60vh; overflow: auto; font: 13px/1.5 var(--font); }
  .step { display: flex; gap: 12px; } .step + .step { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .step > .num { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
         background: var(--soft); color: var(--accent); }
  .step > .num.done { background: var(--ok); color: #fff; }
  .step > div + div { flex: 1; min-width: 0; }
  .pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--line); }
  .pill.ok { background: rgba(5,150,105,.15); } .pill.warn { background: rgba(180,83,9,.15); } .pill.error { background: rgba(220,38,38,.15); color: var(--bad); }
  .comp { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .comp:first-child { border-top: 0; } .comp div { min-width: 0; overflow-wrap: anywhere; }
  .copy { display: flex; gap: 6px; } .copy input { flex: 1; min-width: 0; }
  details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  ol { padding-inline-start: 20px; margin: 6px 0; } li { margin: 3px 0; }
  .banner { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .faqrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 6px; }
  @media (max-width: 520px) { .faqrow { grid-template-columns: 1fr; } }
  [hidden] { display: none !important; }
  /* The OBS dock (?dock=panel): one compact window with everything; the plugin passes OBS's theme so it blends in. */
  :root.light { --bg: #f6f6f9; --panel: #fff; --line: #e4e4ec; --text: #17171f; --muted: #6b6b7b; --soft: #f0eefb;
                --accent: #7c3aed; --ok: #059669; --bad: #dc2626; --warn: #b45309; color-scheme: light; }
  :root.dark { --bg: #14141c; --panel: #1e1e29; --line: #2e2e3d; --text: #ececf3; --muted: #9a9aad; --soft: #262338;
               --accent: #a78bfa; --ok: #34d399; --bad: #f87171; --warn: #fbbf24; color-scheme: dark; }
  :root.obs { --panel: color-mix(in srgb, var(--bg) 93%, var(--text)); --line: color-mix(in srgb, var(--bg) 82%, var(--text));
              --muted: color-mix(in srgb, var(--text) 62%, var(--bg)); }
  body.dock { padding: 6px; font-size: 13px; }
  body.dock .wrap { max-width: none; }
  body.dock header h1 { display: none; }
  body.dock nav { margin-bottom: 8px; }
  body.dock nav a { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  body.dock header { justify-content: flex-end; margin-bottom: 6px; }
  body.dock header .grow { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.dock section { padding: 10px; border-radius: 10px; }
  body.dock .grid { gap: 8px; }
  body.dock h2 { margin-bottom: 6px; }
  body.dock button { min-height: 32px; padding: 6px 10px; border-radius: 8px; }
  body.dock .banner { padding: 8px 10px; margin-bottom: 8px; }
  body.dock ul.feed { max-height: none; }
  body.dock .stats { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
  body.dock .stat b { font-size: 16px; }
  ul.feed time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-inline-end: 6px; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 4px 10px; }
  .status div { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot.warn { background: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">🐾 PixelPaw</h1>
    <span id="hint" class="grow" hidden></span>
    <span id="live" class="badge">…</span>
    <span id="conn" class="dot" title=""></span>
  </header>
  <nav id="nav"></nav>
  <div id="signedout" class="banner" hidden></div>
  <main id="view"></main>
</div>
<script>
(async () => {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") { n.textContent = v; n.dir = "auto"; }
      else if (k.startsWith("on")) n[k] = v; else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const P = new URLSearchParams(location.search);
  // In the OBS dock, remember the dock settings for this browser, so pages reached from inside it
  // (e.g. coming back from Google sign-in) stay in dock mode.
  try {
    if (P.get("dock")) sessionStorage.setItem("pp_dock", location.search);
    else if (sessionStorage.getItem("pp_dock")) {
      new URLSearchParams(sessionStorage.getItem("pp_dock")).forEach((v, k) => { if (!P.has(k)) P.set(k, v); });
      history.replaceState(null, "", "?" + P.toString() + location.hash);
    }
  } catch (e) {}
  const DOCK = P.get("dock") ? "panel" : "";  // older plugin builds asked for activity/controls/drafts
  {
    const root = document.documentElement, hex = (v) => (/^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : "");
    if (["dark", "light"].includes(P.get("theme"))) root.classList.add(P.get("theme"));
    if (hex(P.get("bg")) && hex(P.get("fg"))) {
      root.classList.add("obs"); root.style.setProperty("--bg", hex(P.get("bg"))); root.style.setProperty("--text", hex(P.get("fg")));
    }
    if (DOCK) document.body.classList.add("dock", "dock-" + DOCK);
  }
  const cfg = await fetch("/api/config").then(r => r.json()).catch(() => ({ lang: "en" }));
  const lang = P.get("lang") || cfg.lang || "en";
  const S = await fetch("/api/i18n?lang=" + encodeURIComponent(lang)).then(r => r.json()).catch(() => ({}));
  const t = (s) => (S.app && S.app[s]) || S[s] || s;
  document.documentElement.lang = lang; document.documentElement.dir = S._dir || "ltr";
  const fmt = (n) => (n == null ? "–" : Number(n).toLocaleString(lang));

  async function api(path, body) {
    const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    const r = await fetch(path, opts);
    if (r.status === 401) { showSignedOut(); throw new Error("401"); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok && !data.error) data.error = "HTTP " + r.status;
    return data;
  }
  function showSignedOut() {
    const b = $("#signedout"); b.hidden = false;
    b.textContent = t("Not signed in. On the computer running PixelPaw, open it from its shortcut. On a phone, use the phone link from Settings → Phone access.");
  }
  const busy = async (btn, fn) => { btn.disabled = true; try { return await fn(); } finally { btn.disabled = false; } };
  const copyBox = (value) => { const i = el("input", { type: "text", value, readonly: true });
    return el("div", { class: "copy" }, i, el("button", { onclick: () => { i.select(); navigator.clipboard?.writeText(value); } }, t("Copy"))); };
  const say = (node, cls, text) => { node.className = "msg " + cls; node.textContent = text; };

  // ---------------- state, nav, live updates ----------------
  let state = {};
  const TABS = [DOCK ? ["live", "Live"] : ["home", "Home"], ["drafts", "Drafts"], ["create", "Create"], ["health", "Health"], ["settings", "Settings"], ["setup", "Setup"]];
  function renderNav() {
    const cur = route().tab;
    $("#nav").replaceChildren(...TABS.map(([id, label]) => {
      const a = el("a", { href: "#" + id, class: id === cur ? "on" : "" }, t(label));
      if (id === "drafts" && state.pending) a.append(el("span", { class: "n" }, state.pending));
      if (id === "setup" && state.setup && !state.setup.complete) a.append(" ⚠️");
      return a;
    }));
  }
  function setLive(live) {
    $("#live").textContent = live && live.active ? "● " + t("live_now") : t("offline");
    $("#live").className = "badge" + (live && live.active ? " live" : "");
  }
  async function loadState() {
    state = await api("/api/state");
    $("#title").textContent = "🐾 " + state.channel;
    if (DOCK) { $("#hint").hidden = false; $("#hint").textContent = "🐾 " + state.channel; }
    setLive(state.live); renderNav();
    return state;
  }
  const feedItems = [];
  function describe(ev) {
    switch (ev.kind) {
      case "super_chat": return `💛 ${t("super_chat")} · ${ev.name} ${ev.amount || ""} ${ev.message || ""}`;
      case "member": return `🎉 ${t("new_member")} · ${ev.name}`;
      case "ask": return `🤖 ${ev.name} ${t("asked")}: ${ev.question} → ${ev.answer}`;
      case "replied": return `💬 ${ev.author}: ${ev.text} → ${ev.reply}`;
      case "alert": return `🔔 ${t("alert")}: ${ev.text}`;
      case "live": return ev.active ? `● ${t("live_now")}: ${ev.title}` : `○ ${t("offline")}`;
      case "test": return `🐾 ${ev.message}`;
      default: return ev.kind;
    }
  }
  function feedLine(ev) {
    return el("li", {}, el("time", {}, new Date(ev.ts * 1000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" })),
      el("span", { text: describe(ev) }));
  }
  function connect() {
    const es = new EventSource("/api/events");
    es.onopen = () => { $("#conn").className = "dot on"; $("#conn").title = t("connected"); };
    es.onerror = () => { $("#conn").className = "dot off"; $("#conn").title = t("reconnecting"); };
    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      feedItems.unshift(ev); feedItems.length = Math.min(feedItems.length, 80);
      if (ev.kind === "live") setLive(ev);
      const feed = $("#feed"); if (feed) { feed.querySelector("li.muted")?.remove(); feed.prepend(feedLine(ev)); }
      if (ev.kind === "replied" || ev.kind === "alert") { loadState().catch(() => {}); if (["drafts", "live"].includes(current()) && !editing()) render(); }
      else if (ev.kind === "live" && current() === "live" && !editing()) render();
    };
  }

  // ---------------- routing ----------------
  function route() {
    const [tab, qs] = (location.hash.slice(1) || "").split("?");
    return { tab: TABS.some(([id]) => id === tab) ? tab : "", q: new URLSearchParams(qs || "") };
  }
  // Don't redraw under someone typing a reply or holding a menu open.
  const editing = () => { const a = document.activeElement; return !!a && $("#view").contains(a) && ["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName); };
  const current = () => route().tab || (state.setup && !state.setup.complete ? "setup" : DOCK ? "live" : "home");
  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq, tab = current();
    renderNav();
    const view = $("#view");
    if (!(DOCK && view.dataset.tab === tab)) view.replaceChildren(el("p", { class: "muted" }, "…"));  // the dock refreshes a tab in place
    let node;
    try { node = await PAGES[tab](); } catch (e) { if (e.message === "401") return; node = el("p", { class: "bad", text: String(e) }); }
    if (seq !== renderSeq) return;  // a newer render started meanwhile
    view.replaceChildren(node); view.dataset.tab = tab;
    [...$("#nav").children].forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + tab));
  }
  window.addEventListener("hashchange", render);

  // ---------------- pages ----------------
  const PAGES = {};

  PAGES.home = async () => {
    await loadState();
    const s = state, snap = s.snapshot || {};
    const out = el("div", { class: "grid two" });
    if (!s.setup.complete) out.append(el("section", { class: "wide banner" },
      el("h3", {}, t("Finish setup to start the bot")), el("p", { class: "muted" }, t("It takes about 10 minutes, once.")),
      el("button", { class: "primary", onclick: () => location.hash = "#setup" }, t("Continue setup"))));
    out.append(el("section", { class: "wide" }, el("h2", {}, t("channel")),
      el("div", { class: "stats" },
        ...[[fmt(snap.subscribers), t("subscribers")], [fmt(snap.views), t("total_views")], [fmt(snap.videos), t("videos")],
            [fmt(s.pending), t("drafts")], [s.mode === "auto" ? t("Automatic") : t("Review first"), t("Reply mode")]]
          .map(([v, l]) => el("div", { class: "stat" }, el("b", {}, v), el("span", {}, l))))));
    const q = s.quota, ai = s.ai;
    const msg = el("span", { class: "msg" });
    out.append(el("section", {}, el("h2", {}, t("Today")),
      el("div", {}, t("YouTube quota"), ` · ${fmt(q.total)} / ${fmt(q.limit)}`), el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, 100 * q.total / q.limit)}%` })),
      el("small", {}, `${t("Live chat reserve")}: ${fmt(q.live_reserve)} · ${t("resets at midnight Pacific")}`),
      el("div", { style: "margin-top:10px" }, t("AI answers"), ` · ${fmt(ai.calls)} / ${fmt(ai.limit)} · ${t("free from FAQ/cache")}: ${fmt(ai.cached)}`),
      el("div", { class: "meter" }, el("i", { style: `width:${ai.limit ? Math.min(100, 100 * ai.calls / ai.limit) : 0}%` })),
      el("div", { class: "row" },
        el("button", { onclick: (e) => busy(e.target, async () => { say(msg, "", "…"); const r = await api("/api/action/sweep", {});
          say(msg, r.ok ? "ok" : "bad", r.ok ? `✔ ${t("New")}: ${r.result.new} · ${t("replied")}: ${r.result.replied} · ${t("drafts")}: ${r.result.drafted}` : r.error); loadState(); }) }, t("Check comments now")),
        el("button", { onclick: () => location.hash = "#create" }, t("Daily report")),
        el("button", { onclick: () => api("/api/test", {}) }, t("send_test"))), msg));
    const feed = el("ul", { class: "feed", id: "feed" });
    (feedItems.length ? feedItems : [...s.recent].reverse()).forEach(ev => feed.append(feedLine(ev)));
    if (!feed.children.length) feed.append(el("li", { class: "muted" }, t("no_activity")));
    out.append(el("section", {}, el("h2", {}, t("activity")), feed));
    return out;
  };

  PAGES.drafts = async () => {
    const rows = await api("/api/drafts");
    const box = el("section", {}, el("h2", {}, t("drafts")));
    if (!rows.length) box.append(el("p", { class: "muted" }, t("no_drafts")));
    rows.forEach((r) => {
      const ta = el("textarea", { dir: "auto" }); ta.value = r.draft || "";
      const msg = el("span", { class: "msg" });
      const ok = el("button", { class: "primary" }, t("approve")), no = el("button", {}, t("discard"));
      const d = el("div", { class: "draft" }, el("div", { class: "meta", text: `${r.author} · ${r.video_title || ""} · ${r.category || ""}` }),
        el("p", { text: r.text }), r.note ? el("div", { class: "note", text: r.note }) : null, ta, el("div", { class: "row" }, ok, no, msg));
      let force = false;
      ok.onclick = () => busy(ok, async () => {
        say(msg, "", "…");
        const res = await api(`/api/drafts/${encodeURIComponent(r.id)}/approve`, { text: ta.value, force });
        if (res.status === "posted") { say(msg, "ok", "✔ " + t("posted")); setTimeout(() => { d.remove(); loadState(); }, 900); }
        else if (res.status === "warn") { force = true; ok.textContent = t("approve") + " ⚠️"; say(msg, "warn", "⚠️ " + res.message); }
        else say(msg, "bad", (res.status === "blocked" ? "⛔ " + t("blocked") + ": " : "✖ ") + (res.message || res.error));
      });
      no.onclick = () => busy(no, async () => { await api(`/api/drafts/${encodeURIComponent(r.id)}/discard`, {}); d.remove(); loadState(); });
      box.append(d);
    });
    return box;
  };

  PAGES.create = async () => {
    const out = el("div", { class: "grid two" });
    const mk = (title, desc, fields, action, buildBody) => {
      const res = el("pre", { class: "out", hidden: true }), msg = el("span", { class: "msg" });
      const btn = el("button", { class: "primary" }, t(action));
      btn.onclick = () => busy(btn, async () => {
        say(msg, "", t("Working… this can take a minute")); res.hidden = true;
        const r = await api(...buildBody());
        if (r.ok) { res.textContent = r.text; res.hidden = false; say(msg, "ok", ""); } else say(msg, "bad", r.error || "error");
      });
      return el("section", {}, el("h2", {}, t(title)), el("p", { class: "muted" }, t(desc)), ...fields, el("div", { class: "row" }, btn, msg), res,
        el("div", { class: "row" }, el("button", { onclick: () => navigator.clipboard?.writeText(res.textContent) }, t("Copy"))));
    };
    const count = el("input", { type: "number", value: 8, min: 1, max: 20 }), theme = el("input", { type: "text", placeholder: t("optional, e.g. beginner tutorials") });

          say(msg, r.ok ? "ok" : "bad", r.ok ? `✔ ${t("New")}: ${r.result.new} · ${t("replied")}: ${r.result.replied} · ${t("drafts")}: ${r.result.drafted}` : r.error); loadState(); }) }, t("Check comments now")),
        el("button", { onclick: (e) => busy(e.target, async () => { const r = await api("/api/test", {}); say(msg, r.ok ? "ok" : "bad", r.ok ? "✔ " + t("Test alert sent") : r.error); }) }, t("send_test")),
        s.pending ? el("button", { onclick: () => location.hash = "#drafts" }, `${t("drafts")} (${fmt(s.pending)})`) : null), msg));
    const feed = el("ul", { class: "feed", id: "feed" });
    (feedItems.length ? feedItems : [...s.recent].reverse()).forEach(ev => feed.append(feedLine(ev)));
    if (!feed.children.length) feed.append(el("li", { class: "muted" }, t("no_activity")));
    out.append(el("section", {}, el("h2", {}, t("activity")), feed));
    const mode = el("select", {}, el("option", { value: "review" }, t("Review first (recommended)")), el("option", { value: "auto" }, t("Automatic")));
    mode.value = s.mode;
    const modeMsg = el("span", { class: "msg" });
    mode.onchange = async () => { const r = await api("/api/settings", { comments: { mode: mode.value } });
      say(modeMsg, r.ok ? "ok" : "bad", r.ok ? "✔ " + t("Saved") : r.error); };
    out.append(el("section", {}, el("h2", {}, t("Today")),
      el("div", {}, t("YouTube quota"), ` · ${fmt(q.total)} / ${fmt(q.limit)}`), el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, 100 * q.total / q.limit)}%` })),
      el("div", {}, t("AI answers"), ` · ${fmt(ai.calls)} / ${fmt(ai.limit)}`), el("div", { class: "meter" }, el("i", { style: `width:${ai.limit ? Math.min(100, 100 * ai.calls / ai.limit) : 0}%` })),
      field("Reply mode", mode), modeMsg));
    return out;
  };

  // ---------------- boot ----------------
  try { await loadState(); } catch (e) { if (e.message === "401") { $("#view").replaceChildren(); return; } }
  connect();
  render();
  setInterval(() => {
    if (current() === "live" && !editing()) render();
    else if (current() === "home") loadState().catch(() => {});
  }, DOCK ? 30000 : 60000);
})();
</script>
</body>
</html>
